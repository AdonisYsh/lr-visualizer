name: Build toolchain
description: >
  Rust from rust-toolchain.toml, wasm-bindgen-cli at the exact version
  engine/Cargo.toml pins, and wasm-opt from a checksummed binaryen release.

runs:
  using: composite
  steps:
    - name: Install Rust (rust-toolchain.toml)
      shell: bash
      run: rustup toolchain install && rustc --version

    # The CLI must match the crate exactly; read the pin rather than repeat it.
    - name: Read the wasm-bindgen pin
      id: pin
      shell: bash
      run: |
        version="$(sed -n 's/^wasm-bindgen *= *"=\([0-9.]*\)".*/\1/p' engine/Cargo.toml | head -1)"
        [ -n "$version" ] || { echo "no exact wasm-bindgen pin in engine/Cargo.toml" >&2; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install wasm-bindgen-cli
      uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
      with:
        tool: wasm-bindgen@${{ steps.pin.outputs.version }}

    - name: Install wasm-opt (binaryen)
      shell: bash
      env:
        BINARYEN_VERSION: "133"
        BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
      run: |
        tarball="$RUNNER_TEMP/binaryen.tar.gz"
        curl -fsSL -o "$tarball" \
          "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
        echo "${BINARYEN_SHA256}  $tarball" | sha256sum -c -
        tar -xzf "$tarball" -C "$RUNNER_TEMP"
        # bin/ and lib/ keep their relative layout, so wasm-opt finds its library.
        sudo cp -r "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/." /usr/local/
        wasm-opt --version
