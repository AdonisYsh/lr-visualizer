# cargo-deny: run `cargo deny check` in engine/. Used by the Security workflow.

[graph]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Unlicense"]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
